<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CYD Clock Simulator</title>
  <meta name="theme-color" content="#191970" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      /* desk.jpg tiled and enlarged 200% as the page background. */
      background: url("./desk.jpg") repeat;
      background-size: 1024px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .simulator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    /* The live display: crisp landscape 2x (320x240 panel -> 640x480).
       Note: one CYD pixel is two browser pixels here. */
    .stage {
      position: relative;
      z-index: 0; /* stacking context so the cord sits behind the case */
      flex: 0 0 auto;
      --stage-height: 480px;
      width: 640px;
      height: var(--stage-height);
    }
    #screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      z-index: 1;
    }
    /* The same portrait device photo, rotated 90 degrees clockwise to match the
       landscape clock panel. These coordinates are the portrait alignment values
       transformed into landscape space, so the original screen opening still
       frames the canvas exactly after rotation. */
    .stage .case {
      position: absolute;
      z-index: 0;
      width: 169.844%;
      height: 290.833%;
      left: 165.313%;
      top: -62.708%;
      transform-origin: top left;
      transform: rotate(90deg);
      filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.55));
    }
    /* The portrait USB cord, rotated 90 degrees clockwise into a right-pointing
       landscape cord. It extends past the viewport edge even when zoomed out. */
    .stage .cord {
      position: absolute;
      z-index: 0;
      left: 165.313%;
      top: 45.833%;
      width: 100vw;
      height: 7.292%;
      /* dark grey cord with a lighter sheen stripe across its height */
      background: linear-gradient(to bottom, rgb(20, 20, 27) 0 50%, rgb(67, 72, 103) 50% 90%, rgb(20, 20, 27) 90% 100%);
    }
    .boot-button {
      min-width: 72px;
      margin-top: calc(var(--stage-height) * -0.205);
      padding: 7px 16px 8px;
      border: 1px solid rgb(58, 60, 66); /* charcoal gray */
      border-radius: 6px;
      background: linear-gradient(to bottom, rgb(116, 120, 127) 0%, rgb(67, 71, 79) 52%, rgb(44, 47, 53) 100%);
      color: rgb(230, 232, 235); /* off-white */
      font: 600 13px/1.1 "Trebuchet MS", "Verdana", sans-serif;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      box-shadow: 0 2px 0 rgb(30, 31, 35), 0 8px 18px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      touch-action: none;
    }
    .boot-button:hover {
      filter: brightness(1.05);
    }
    .boot-button:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 rgb(30, 31, 35), 0 5px 12px rgba(0, 0, 0, 0.28);
    }
  </style>
</head>

<body>
  <div class="simulator">
    <div class="stage">
      <div class="cord"></div>
      <img class="case" src="./case.png" alt="CYD device case" />
      <canvas id="screen" aria-label="CYD clock display simulator"></canvas>
    </div>
    <!-- Intentionally inert for now; future reset behavior will be wired here. -->
    <button id="boot-button" class="boot-button" type="button">boot</button>
  </div>
  <script type="module" src="./app.js"></script>
</body>

</html>
