[package]
name = "linkage-blaze-editor-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Host and WebAssembly tools for Linkage Blaze linkage programs"
documentation = "https://docs.rs/linkage-blaze-editor-wasm"
readme = "../../README.md"
keywords = ["kinematics", "wasm", "bvh", "animation", "graphics"]
categories = ["command-line-utilities", "wasm", "graphics"]

# Browser program editor adapter. The published library remains an ordinary
# Rust library and does not carry WebAssembly or JavaScript glue.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
derive_more = { version = "2.1.1", default-features = false, features = ["from"] }
linkage-blaze = { workspace = true, features = ["alloc"] }
wasm-bindgen = "=0.2.126"
