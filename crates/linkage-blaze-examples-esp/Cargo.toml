[features]
default = ["esp32"]
esp32 = [
    "device-envoy-esp/esp32",
    "esp-hal/esp32",
    "esp-rtos/esp32",
    "esp-backtrace/esp32",
    "esp-println/esp32",
    "esp-bootloader-esp-idf/esp32",
]
esp32c2 = [
    "device-envoy-esp/esp32c2",
    "esp-hal/esp32c2",
    "esp-rtos/esp32c2",
    "esp-backtrace/esp32c2",
    "esp-println/esp32c2",
    "esp-bootloader-esp-idf/esp32c2",
]
esp32c3 = [
    "device-envoy-esp/esp32c3",
    "esp-hal/esp32c3",
    "esp-rtos/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-println/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
]
esp32c5 = [
    "device-envoy-esp/esp32c5",
    "esp-hal/esp32c5",
    "esp-rtos/esp32c5",
    "esp-backtrace/esp32c5",
    "esp-println/esp32c5",
    "esp-bootloader-esp-idf/esp32c5",
]
esp32c6 = [
    "device-envoy-esp/esp32c6",
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-println/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
]
esp32c61 = [
    "device-envoy-esp/esp32c61",
    "esp-hal/esp32c61",
    "esp-rtos/esp32c61",
    "esp-backtrace/esp32c61",
    "esp-println/esp32c61",
    "esp-bootloader-esp-idf/esp32c61",
]
esp32h2 = [
    "device-envoy-esp/esp32h2",
    "esp-hal/esp32h2",
    "esp-rtos/esp32h2",
    "esp-backtrace/esp32h2",
    "esp-println/esp32h2",
    "esp-bootloader-esp-idf/esp32h2",
]
esp32s2 = [
    "device-envoy-esp/esp32s2",
    "esp-hal/esp32s2",
    "esp-rtos/esp32s2",
    "esp-backtrace/esp32s2",
    "esp-println/esp32s2",
    "esp-bootloader-esp-idf/esp32s2",
]
esp32s3 = [
    "device-envoy-esp/esp32s3",
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-println/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
]
# Each example module is gated in `linkage-blaze`; enable only the
# one being built so unused modules (and ballet's slow `MOTION` const) are never
# compiled. The example targets above list these in their `required-features`.
armatron = ["linkage-blaze/examples-armatron"]
ballet = ["linkage-blaze/examples-ballet"]
skeleton-clock = ["linkage-blaze/examples-skeleton-clock"]
clock = ["linkage-blaze/examples-clock"]

[dependencies]
embedded-graphics = { version = "0.8", default-features = false }
heapless = "0.9.1"
log = { version = "0.4", default-features = false }
linkage-blaze.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
device-envoy-core = { version = "0.1.1", default-features = false }
embassy-time = "0.5.1"
derive_more = { version = "2.1.1", default-features = false, features = [
    "from",
] }
embassy-executor = "0.10.0"
static_cell = "2.1.1"
device-envoy-esp = { version = "0.1.1", default-features = false }
paste = "1.0"
time = { version = "0.3.47", default-features = false }
esp-hal = { version = "1.1.0", default-features = false, features = [
    "unstable",
] }
esp-rtos = { version = "0.3.0", default-features = false, features = [
    "embassy",
] }
esp-backtrace = { version = "0.19.0", default-features = false, features = [
    "panic-handler",
    "halt-cores",
    "println",
] }
esp-println = { version = "0.17.0", default-features = false, features = [
    "uart",
    "log-04",
] }
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false }
