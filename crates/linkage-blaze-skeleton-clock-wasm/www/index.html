<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CYD Skeleton-Clock Simulator</title>
  <meta name="theme-color" content="#191970" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      /* desk.jpg tiled and enlarged 200% as the page background. */
      background: url("./desk.jpg") repeat;
      background-size: 1024px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The live display: crisp portrait 2x (240x320 panel -> 480x640).
       Note: one CYD pixel is two browser pixels here. */
    .stage {
      position: relative;
      z-index: 0; /* stacking context so the cord sits behind the case */
      flex: 0 0 auto;
      width: calc(min(96vw, calc(96vh * 3 / 4)) * var(--browser-zoom, 1));
      aspect-ratio: 3 / 4;
    }
    #screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      z-index: 1;
    }
    /* The portrait (rotated) device photo, framing the display. Explicit
       width/height/left/top (browser px) align its screen opening to the 480x640
       canvas; nudge these four to adjust the fit. */
    .stage .case {
      position: absolute;
      z-index: 0;
      width: 226.458%;
      height: 218.125%;
      left: -62.708%;
      top: -65.313%;
      filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.55));
    }
    /* Extends the USB cord off the top of the page. The case covers the part
       behind the device, and the cord still reaches the viewport edge when zoomed out. */
    .stage .cord {
      position: absolute;
      z-index: 0;
      left: 45.833%;
      width: 7.292%;
      top: -100vh;
      height: 100vh;
      /* dark grey cord with a lighter sheen stripe from 50%-90% of its width */
      background: linear-gradient(to right, rgb(20, 20, 27) 0 50%, rgb(67, 72, 103) 50% 90%, rgb(20, 20, 27) 90% 100%);
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="cord"></div>
    <img class="case" src="./case.png" alt="CYD device case" />
    <canvas id="screen" aria-label="CYD skeleton-clock display simulator"></canvas>
  </div>
  <script type="module" src="./app.js"></script>
</body>

</html>
