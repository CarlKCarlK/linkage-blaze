[package]
name = "linkage-blaze-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
derive_more = { version = "2.1.1", default-features = false, features = ["from"] }
device-envoy-core = { version = "0.1.0", default-features = false }
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
embedded-graphics = { version = "0.8", default-features = false }
heapless = "0.9.1"
libm = "0.2"
log = { version = "0.4", default-features = false }
nanorand = { version = "0.8", default-features = false, features = ["wyrand"] }
profont = "0.7"
static_cell = "2.1.1"
time = { version = "0.3.47", default-features = false }

[features]
alloc = []
# Each generic example is gated behind its own feature so a consumer compiles
# only the example it actually uses — in particular `examples-ballet`'s heavy
# embedded `MOTION` const is evaluated only when that feature is on. Nothing
# is on by default; every consumer opts in to the examples it needs.
# The `armatron` example — local armatron state, calibration geometry, and the generic game loop.
examples-armatron = []
# The `ballet` example embeds a motion-capture const that is slow to evaluate;
# keep it off unless the `ballet` example is being built. It draws through
# `device-envoy-core::cyd` but has no `ClockSync` needs, so it stays off the
# `wifi` feature (→ embassy-executor) that `examples-skeleton-clock`/`examples-clock` need.
examples-ballet = []
# The `skeleton_clock` example needs device-envoy's `ClockSync` (→ embassy-executor).
# `ballet` does not, so platforms that only want `ballet` (e.g. the WASM build,
# which must avoid embassy-executor's unprovided `__pender` arch symbol) can
# disable this and keep the dependency graph lean.
examples-skeleton-clock = ["device-envoy-core/wifi"]
# The analog `clock` example, like `skeleton_clock`, needs device-envoy's `ClockSync`.
examples-clock = ["device-envoy-core/wifi"]

[dev-dependencies]
embassy-time = { version = "0.5.1", features = ["std"] }
futures-executor = "0.3"
png = "0.18"
trybuild = "1.0"

[dev-dependencies.device-envoy-core]
version = "0.1.0"
default-features = false
features = ["host"]
