[package]
name = "linkage-blaze-armatron-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
# Pull in embassy-time's built-in WASM time driver here in the final WASM
# crate only. The generic armatron loop reads Instant::now() for FPS display.
device-envoy-core = { version = "0.1.0", default-features = false }
embassy-executor = { version = "0.10.0", features = [
    "platform-wasm",
    "executor-thread",
] }
embassy-time = { version = "0.5.1", features = ["wasm", "generic-queue-64"] }
embedded-graphics = { version = "0.8", default-features = false }
linkage-blaze-cyd-wasm = { path = "../linkage-blaze-cyd-wasm" }
linkage-blaze-cyd-core = { path = "../linkage-blaze-cyd-core" }
linkage-blaze-example-core = { path = "../linkage-blaze-example-core", default-features = false, features = [
    "armatron",
] }
linkage-blaze-core.workspace = true
wasm-bindgen = "=0.2.118"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "console",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "PointerEvent",
    "Window",
] }
