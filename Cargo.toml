[workspace]
members = [
    "xtask",
    "crates/linkage-blaze",
    "crates/linkage-blaze-examples-wasm",
    "crates/linkage-blaze-editor-wasm",
    "crates/linkage-blaze-examples-esp",
    "crates/linkage-blaze-examples-rp",
]
exclude = ["tombstones"]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CarlKCarlK/linkage-blaze"
homepage = "https://github.com/CarlKCarlK/linkage-blaze"

[workspace.dependencies]
linkage-blaze = { version = "0.1.5", path = "crates/linkage-blaze" }

# Build against the local sister `device-envoy` working copy instead of the
# published crates.io releases, so `cargo check-all` catches breakage from
# in-progress device-envoy changes before they are published.
[patch.crates-io]
device-envoy-core = { path = "../mcu/device-envoy/crates/device-envoy-core" }
device-envoy-esp = { path = "../mcu/device-envoy/crates/device-envoy-esp" }
device-envoy-rp = { path = "../mcu/device-envoy/crates/device-envoy-rp" }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
