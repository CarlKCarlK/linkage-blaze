[workspace]
members = [
    "xtask",
    "crates/linkage-blaze-core",
    "crates/linkage-blaze-example-core",
    "crates/linkage-blaze-editor",
    "crates/linkage-blaze-esp",
    "crates/linkage-blaze-rp",
]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
linkage-blaze-core = { path = "crates/linkage-blaze-core" }

# Build against the local sister `device-envoy` working copy instead of the
# published crates.io releases, so `just check-all` catches breakage from
# in-progress device-envoy changes before they are published.
[patch.crates-io]
device-envoy-core = { path = "../mcu/device-envoy/crates/device-envoy-core" }
device-envoy-esp = { path = "../mcu/device-envoy/crates/device-envoy-esp" }
device-envoy-rp = { path = "../mcu/device-envoy/crates/device-envoy-rp" }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
