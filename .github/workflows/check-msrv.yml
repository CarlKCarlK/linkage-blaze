name: Check MSRV

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out device-envoy
        uses: ./.github/actions/checkout-device-envoy

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.93

      - name: Check workspace MSRV
        run: |
          cargo check -p linkage-blaze --no-default-features
          cargo check -p linkage-blaze --no-default-features --features alloc
          cargo check -p linkage-blaze --no-default-features --features bvh
          cargo check -p linkage-blaze-editor-wasm
