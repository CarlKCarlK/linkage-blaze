name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out device-envoy
        uses: actions/checkout@v4
        with:
          repository: CarlKCarlK/device-envoy
          ref: v0.1.4
          path: device-envoy-src

      - name: Mirror local device-envoy patch path
        run: |
          mkdir -p ../mcu
          ln -s "$GITHUB_WORKSPACE/device-envoy-src" ../mcu/device-envoy

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Wasm Rust target
        run: rustup target add wasm32-unknown-unknown

      - name: Build Pages
        run: cargo xtask build-pages

      - name: Verify canonical CYD simulator assets
        shell: bash
        run: |
          set -euo pipefail
          canonical="device-envoy-src/crates/device-envoy-core/www"
          while IFS= read -r -d '' simulator_javascript; do
            page_directory="${simulator_javascript%/*}"
            cmp "$canonical/cyd-simulator.js" "$page_directory/cyd-simulator.js"
            cmp "$canonical/cyd-simulator.css" "$page_directory/cyd-simulator.css"
            cmp "$canonical/case.png" "$page_directory/case.png"
            cmp "$canonical/desk.jpg" "$page_directory/desk.jpg"
          done < <(find target/pages/demos -type f -name cyd-simulator.js -print0)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
